name: Smoke Test with IPv6
'on':
  pull_request: {}
  push:
    branches:
    - v1.12
    - ft/v1.12/**
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after
    }}
  cancel-in-progress: true
env:
  cilium_cli_version: v0.12.12
  KIND_VERSION: v0.17.0
  KIND_CONFIG: .github/kind-config-ipv6.yaml
  CONFORMANCE_TEMPLATE: examples/kubernetes/connectivity-check/connectivity-check-internal.yaml
  TIMEOUT: 5m
  LOG_TIME: 30m
jobs:
  check_changes:
    name: Deduce required tests from code changes
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.tested-tree.outputs.src }}
    steps:
    - name: Checkout code
      if: ${{ !github.event.pull_request }}
      uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8
      with:
        persist-credentials: false
    - name: Check code changes
      uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50
      id: tested-tree
      with:
        base: ${{ github.ref }}
        filters: "src:\n  - '!(test|Documentation)/**'\n"
  conformance-test-ipv6:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.tested == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8
      with:
        persist-credentials: false
    - name: Set image tag
      id: vars
      run: "if [ ${{ github.event.pull_request.head.sha }} != \"\" ]; then\n  echo\
        \ tag=${{ github.event.pull_request.head.sha }} >> $GITHUB_OUTPUT\nelse\n\
        \  echo tag=${{ github.sha }} >> $GITHUB_OUTPUT\nfi\n"
    - name: Precheck generated connectivity manifest files
      run: 'make -C examples/kubernetes/connectivity-check fmt

        make -C examples/kubernetes/connectivity-check all

        test -z "$(git status --porcelain)" || (echo "please run ''make -C examples/kubernetes/connectivity-check
        fmt all'' and submit your changes"; exit 1)

        '
    - name: Enable IPv6 in docker
      run: 'sudo cat /etc/docker/daemon.json || true

        # Keep existing config like cgroup-parent in github action

        sudo sh -c "echo ''{ \"exec-opts\": [\"native.cgroupdriver=cgroupfs\"], \"cgroup-parent\":
        \"/actions_job\", \"ipv6\": true, \"fixed-cidr-v6\": \"2001:db8:1::/64\" }''
        > /etc/docker/daemon.json"

        sudo cat /etc/docker/daemon.json

        sudo ip -6 route add 2001:db8:1::/64 dev docker0

        sudo sysctl net.ipv6.conf.default.forwarding=1

        sudo sysctl net.ipv6.conf.all.forwarding=1

        sudo systemctl restart docker

        '
    - name: Create kind cluster
      uses: helm/kind-action@d8ccf8fb623ce1bb360ae2f45f323d9d5c5e9f00
      with:
        version: ${{ env.KIND_VERSION }}
        config: ${{ env.KIND_CONFIG }}
    - name: Wait for images to be available
      timeout-minutes: 30
      shell: bash
      run: "for image in cilium-ci operator-generic-ci hubble-relay-ci ; do\n  until\
        \ docker manifest inspect quay.io/${{ github.repository_owner }}/$image:${{\
        \ steps.vars.outputs.tag }} &> /dev/null; do sleep 45s; done\ndone\n"
    - name: Install cilium chart
      run: "helm upgrade -i cilium ./install/kubernetes/cilium \\\n  --namespace kube-system\
        \ \\\n  --set nodeinit.enabled=true \\\n  --set kubeProxyReplacement=strict\
        \ \\\n  --set ipam.mode=kubernetes \\\n  --set image.repository=quay.io/${{\
        \ github.repository_owner }}/cilium-ci \\\n  --set image.tag=${{ steps.vars.outputs.tag\
        \ }} \\\n  --set image.pullPolicy=IfNotPresent \\\n  --set image.useDigest=false\
        \ \\\n  --set hubble.relay.enabled=true \\\n  --set hubble.relay.image.repository=quay.io/${{\
        \ github.repository_owner }}/hubble-relay-ci \\\n  --set hubble.relay.image.tag=${{\
        \ steps.vars.outputs.tag }} \\\n  --set hubble.relay.image.pullPolicy=IfNotPresent\
        \ \\\n  --set hubble.relay.image.useDigest=false \\\n  --set operator.image.repository=quay.io/${{\
        \ github.repository_owner }}/operator \\\n  --set operator.image.suffix=-ci\
        \ \\\n  --set operator.image.tag=${{ steps.vars.outputs.tag }} \\\n  --set\
        \ operator.image.pullPolicy=IfNotPresent \\\n  --set operator.image.useDigest=false\
        \ \\\n  --set ipv6.enabled=true \\\n  --set ipv4.enabled=false \\\n  --set\
        \ tunnel=disabled \\\n  --set autoDirectNodeRoutes=true \\\n  --set ipv6NativeRoutingCIDR=2001:db8:1::/64\
        \ \\\n  --set ingressController.enabled=true\n\nkubectl wait -n kube-system\
        \ --for=condition=Ready --all pod --timeout=${{ env.TIMEOUT }}\n# To make\
        \ sure that cilium CRD is available (default timeout is 5m)\nkubectl wait\
        \ --for condition=Established crd/ciliumnetworkpolicies.cilium.io --timeout=5m\n\
        \nkubectl port-forward -n kube-system deployment/hubble-relay 4245:4245 &\n"
    - name: Run conformance test (e.g. connectivity check without external 1.1.1.1
        and www.google.com)
      run: 'kubectl apply -f ${{ env.CONFORMANCE_TEMPLATE }}

        kubectl wait --for=condition=Available --all deployment --timeout=${{ env.TIMEOUT
        }}

        '
    - name: Capture cilium-sysdump
      if: ${{ failure() }}
      shell: script -q -e -c "bash --noprofile --norc -eo pipefail {0}"
      run: 'echo "=== Install Cilium CLI ==="

        curl -sSL --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${{
        env.cilium_cli_version }}/cilium-linux-amd64.tar.gz{,.sha256sum}

        sha256sum --check cilium-linux-amd64.tar.gz.sha256sum

        sudo tar xzvfC cilium-linux-amd64.tar.gz /usr/bin

        rm cilium-linux-amd64.tar.gz{,.sha256sum}

        cilium version


        echo "=== Retrieve cluster state ==="

        kubectl get pods --all-namespaces -o wide

        cilium status

        cilium sysdump --output-filename cilium-sysdump-out

        '
    - name: Upload cilium-sysdump
      uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce
      if: ${{ failure() }}
      with:
        name: cilium-sysdump-out.zip
        path: cilium-sysdump-out.zip
